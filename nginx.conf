# ============================================================
# NagarSetu V2.0 — Nginx Reverse-Proxy Configuration
# Phase 15: Gateway Proxy  172.30.0.10:80/443
# Upstreams: frontend 172.30.0.40:3000 | backend 172.30.0.30:4000
# ============================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---- Logging ------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # ---- Performance --------------------------------------------
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    gzip               on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length    1024;

    # ---- Upstreams ----------------------------------------------
    upstream frontend_pool {
        server 172.30.0.40:3000;
        keepalive 32;
    }

    upstream backend_pool {
        server 172.30.0.30:4000;
        keepalive 64;
    }

    # ---- HTTP -> HTTPS Redirect ---------------------------------
    server {
        listen 80;
        server_name _;

        # Allow Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other HTTP to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---- HTTPS Main Server --------------------------------------
    server {
        listen 443 ssl http2;
        server_name nagarsetu.local localhost;

        # TLS certificates (mount ./certs at container start)
        ssl_certificate      /etc/nginx/certs/nagarsetu.crt;
        ssl_certificate_key  /etc/nginx/certs/nagarsetu.key;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_ciphers          HIGH:!aNULL:!MD5;
        ssl_session_cache    shared:SSL:10m;
        ssl_session_timeout  1d;

        # Security Headers
        add_header X-Frame-Options           SAMEORIGIN always;
        add_header X-Content-Type-Options    nosniff always;
        add_header X-XSS-Protection          "1; mode=block" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        # ---- /api/ — REST API Proxy (Backend) -------------------
        location /api/ {
            proxy_pass         http://backend_pool;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;
        }

        # ---- /socket.io/ — WebSocket Upgrade (Backend) ----------
        location /socket.io/ {
            proxy_pass         http://backend_pool;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_read_timeout 3600s;
        }

        # ---- /streams/ — CCTV Stream Static Assets (Cached) ----
        location /streams/ {
            alias   /var/www/streams/;
            expires 1h;
            add_header Cache-Control "public, must-revalidate";
            add_header Access-Control-Allow-Origin "*";
            types {
                video/mp4  mp4;
                video/webm webm;
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
        }

        # ---- / — Next.js Frontend (Default) ---------------------
        location / {
            proxy_pass         http://frontend_pool;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # ---- Static Next.js Assets (Cache aggressive) -----------
        location /_next/static/ {
            proxy_pass http://frontend_pool;
            expires 365d;
            add_header Cache-Control "public, immutable";
        }
    }
}
