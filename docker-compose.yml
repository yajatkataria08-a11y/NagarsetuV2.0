version: '3.8'

# ============================================================
# NagarSetu V2.0 — Production Docker Orchestration
# Phase 15: 5-Service Container Grid with Nginx Gateway
# Static subnet: 172.30.0.0/24
# ============================================================

services:

  # ----------------------------------------------------------
  # 1. Nginx Reverse-Proxy / TLS Terminator (Port 80 / 443)
  # ----------------------------------------------------------
  gateway_proxy:
    image: nginx:1.27-alpine
    container_name: nagarsetu_gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./backend/public/streams:/var/www/streams:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      nagarsetu_net:
        ipv4_address: 172.30.0.10
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------
  # 2. Next.js 15 Tactical Command Center (Port 3000)
  # ----------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://backend:4000
    container_name: nagarsetu_frontend
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:4000
      - NEXT_PUBLIC_WS_URL=ws://backend:4000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      nagarsetu_net:
        ipv4_address: 172.30.0.40
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ----------------------------------------------------------
  # 3. Express + Socket.IO Unified API Gateway (Port 4000)
  # ----------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nagarsetu_backend
    expose:
      - "4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - FRONTEND_URL=http://gateway_proxy:80
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_FROM_NUMBER=${TWILIO_FROM_NUMBER:-}
      - TWILIO_WHATSAPP_FROM=${TWILIO_WHATSAPP_FROM:-whatsapp:+14155238886}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - AI_ENGINE_URL=http://ai_engine:8000
      - DEMO_MODE=${DEMO_MODE:-true}
    depends_on:
      ai_engine:
        condition: service_healthy
      spatial_db:
        condition: service_healthy
    networks:
      nagarsetu_net:
        ipv4_address: 172.30.0.30
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/api/health"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 20s

  # ----------------------------------------------------------
  # 4. FastAPI AI Microservice — Risk + Vision + Triage (Port 8000)
  # ----------------------------------------------------------
  ai_engine:
    build:
      context: ./ai_engine
      dockerfile: Dockerfile
    container_name: nagarsetu_ai
    expose:
      - "8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - MODEL_DIR=/app/models
      - LOG_LEVEL=info
    volumes:
      - ai_models:/app/models
    networks:
      nagarsetu_net:
        ipv4_address: 172.30.0.20
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  # ----------------------------------------------------------
  # 5. PostGIS Spatial Database (Port 5432)
  # ----------------------------------------------------------
  spatial_db:
    image: postgis/postgis:16-3.4-alpine
    container_name: nagarsetu_postgis
    expose:
      - "5432"
    environment:
      - POSTGRES_DB=nagarsetu
      - POSTGRES_USER=${POSTGRES_USER:-nagarsetu}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-nagarsetu_secure_pwd}
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./database/schema_master.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    networks:
      nagarsetu_net:
        ipv4_address: 172.30.0.50
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nagarsetu} -d nagarsetu"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

# ============================================================
# Named Volumes
# ============================================================
volumes:
  postgis_data:
    driver: local
    name: nagarsetu_postgis_data
  ai_models:
    driver: local
    name: nagarsetu_ai_models

# ============================================================
# Static-IP Bridge Network  172.30.0.0/24
# ============================================================
networks:
  nagarsetu_net:
    driver: bridge
    name: nagarsetu_network
    ipam:
      driver: default
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
